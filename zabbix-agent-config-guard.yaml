zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 57b7ae836ca64446ba2c296389c009b7
    name: Templates/Modules
  templates:
  - uuid: 27ec88946c4a47279d5308abc7c011b9
    template: Zabbix agent config guard Linux by Zabbix agent active
    name: Zabbix agent config guard Linux by Zabbix agent active
    description: |
      Checks ServerActive policy and active-check heartbeat settings in the agent configuration file.

      Collects the file once per hour. Reads the last matching ServerActive and HeartbeatFrequency declarations, allowing surrounding whitespace. The default ServerActive policy rejects empty values, commas and internal whitespace; this is a deployment policy, not a complete validator of Zabbix configuration syntax. Independent servers separated by commas and spaces in address lists are supported by Zabbix itself.

      HeartbeatFrequency is reported in seconds; 0 disables the heartbeat. An absent declaration means 60 seconds. Unrecognized or out-of-range declarations produce an item preprocessing error. Supported interval spellings cover agent 2 and classic-agent suffixes; extraction does not prove that the installed agent accepts a particular spelling. A collection trigger checks that both derived items receive data within the configured window.

      Applicability:
      - Active Zabbix agent checks; agent 2 versions 7.0.0 and 7.0.32 were used to check the revised parsing rules.
      - Heartbeat availability requires agent version 6.2 or newer.
      - Self-contained on Linux and pfSense. Add host-level dependencies on the local agent-availability triggers during deployment; no Linux OS template is required by this export.
      - Link only one OS variant; both define the same item keys.

      Limitations:
      - Reads the selected file, not the running configuration; connection settings require an agent restart to take effect.
      - Include files are not read. A later declaration in an included file may change the value used by the agent.
      - Does not validate DNS, network reachability, or whether an address matches the assigned proxy.
      - The agent must be able to read the file. vfs.file.contents and agent-version limits apply; 64 KB is not a universal limit.
      - The raw file is transferred to the server/proxy for preprocessing and is not retained in item history.

      Macros:
      - {$AGENT.CONF.PATH}: configuration path; default /etc/zabbix/zabbix_agent2.conf.
      - {$AGENT.SERVERACTIVE.MATCHES}: expected ServerActive regexp; default ^[^,\s]+$.
      - {$AGENT.CONF.NODATA}: missing-data window; default 3h for the 1h collection interval.

      Author:  Konstantin Tyutyunnik / Константин Тютюнник
      Site:    https://itforprof.com
      Repo:    https://github.com/IT-for-Prof/zabbix-agent-config-guard
      License: MIT (c) 2026 Konstantin Tyutyunnik
    vendor:
      name: itforprof.com
      version: 1.2.0
    groups:
    - name: Templates/Modules
    items:
    - uuid: 5e453bc723704d32985ebc9edaf7128a
      name: 'Zabbix agent: configuration file'
      type: ZABBIX_ACTIVE
      key: vfs.file.contents["{$AGENT.CONF.PATH}"]
      delay: 1h
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Raw configuration file for dependent-item preprocessing. No history is retained. When collection
        stops, inspect this item for file/path/permission errors and check agent availability; a silent active agent
        may leave no item error. vfs.file.contents size limits depend on the agent version.
      tags:
      - tag: component
        value: agent
      - tag: scope
        value: configuration
      - tag: check
        value: configuration_collection
    - uuid: 0f4da753721344a0be0b71f278b280a1
      name: 'Zabbix agent: ServerActive'
      type: DEPENDENT
      key: agent.conf.serveractive
      history: 7d
      trends: '0'
      # shortcut: 255-character ServerActive limit; migrate to TEXT when longer lists are required.
      value_type: CHAR
      description: Last ServerActive declaration in the selected file, with surrounding whitespace removed. Empty
        when absent. Include files and running state are outside this item. The policy regexp is configurable and
        is not a full syntax validator.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var m = value.match(/^[ \t]*ServerActive[ \t]*=.*$/gm);
          if (!m) return '';
          var line = m[m.length - 1];
          return line.substring(line.indexOf('=') + 1).replace(/^\s+|\s+$/g, '');
      master_item:
        key: vfs.file.contents["{$AGENT.CONF.PATH}"]
      tags:
      - tag: component
        value: agent
      - tag: scope
        value: configuration
      - tag: check
        value: serveractive
    - uuid: e3d7f22324ab44009e2684da91a77bd1
      name: 'Zabbix agent: HeartbeatFrequency'
      type: DEPENDENT
      key: agent.conf.heartbeat
      history: 7d
      trends: '0'
      value_type: UNSIGNED
      units: s
      description: Last HeartbeatFrequency declaration in the selected file, normalized to seconds. Accepts agent
        2 interval suffixes s/m/h/d/w and classic-agent binary suffixes K/M/G/T. This extraction is not a syntax
        check for the installed agent family. The absent parameter defaults to 60; an explicitly empty value is
        interpreted as 0 according to agent 2 rules. Unrecognized values and intervals outside 0-3600 seconds produce
        a preprocessing error. Include files and running state are not inspected.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var m = value.match(/^[ \t]*HeartbeatFrequency[ \t]*=.*$/gm);
          if (!m) return 60;
          var line = m[m.length - 1];
          var raw = line.substring(line.indexOf('=') + 1).replace(/^\s+|\s+$/g, '');
          if (raw === '') return 0;
          var n = raw.match(/^([+-]?\d+)([smhdwKMGT]?)$/);
          if (!n) throw 'Invalid HeartbeatFrequency: expected an integer interval';
          var seconds = Number(n[1]) * ({'': 1, s: 1, m: 60, h: 3600, d: 86400, w: 604800, K: 1024, M: 1048576, G: 1073741824, T: 1099511627776})[n[2]];
          if (seconds < 0 || seconds > 3600) throw 'Invalid HeartbeatFrequency: expected 0-3600 seconds';
          return seconds;
      master_item:
        key: vfs.file.contents["{$AGENT.CONF.PATH}"]
      tags:
      - tag: component
        value: agent
      - tag: scope
        value: configuration
      - tag: check
        value: heartbeat
    tags:
    - tag: class
      value: monitoring
    - tag: target
      value: zabbix-agent
    - tag: vendor
      value: zabbix
    macros:
    - macro: '{$AGENT.CONF.NODATA}'
      value: 3h
      description: How long either derived configuration item may receive no data before alerting. Default 3h, three
        times the 1h file collection interval. Do not enable discard-unchanged preprocessing on the collection chain
        without revisiting this window.
    - macro: '{$AGENT.CONF.PATH}'
      value: /etc/zabbix/zabbix_agent2.conf
      description: Absolute path of the agent config file. Use /etc/zabbix/zabbix_agentd.conf for agent 1. A wrong
        path makes the master item unsupported, which the collection trigger reports.
    - macro: '{$AGENT.SERVERACTIVE.MATCHES}'
      value: ^[^,\s]+$
      description: 'Deployment policy for the extracted ServerActive value. Default: nonempty, no commas and no
        internal whitespace. Zabbix supports independent servers and address-list whitespace; rejecting them is
        this policy, not a claim about Zabbix syntax. Override on a host when its intended topology differs.'
