  triggers:
  - uuid: a1378435c5eb44abac42966b4c268fef
    expression: find(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.serveractive,,"regexp","{$AGENT.SERVERACTIVE.MATCHES}")=0
    name: 'Zabbix agent: ServerActive does not match policy'
    event_name: 'Zabbix agent on {HOST.NAME}: ServerActive does not match policy'
    priority: AVERAGE
    description: The value extracted from the selected file does not match the configured policy. Check {$AGENT.CONF.PATH},
      the expected topology and {$AGENT.SERVERACTIVE.MATCHES}. A comma denotes independent servers; a semicolon
      denotes cluster members. Internal whitespace is forbidden by the default policy even though Zabbix accepts
      spaces. The value may be empty because ServerActive is absent from this file. Include files and running configuration
      are not inspected. Apply intended connection changes by restarting the agent.
    dependencies:
    - name: 'Zabbix agent: configuration not collected'
      expression: nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.serveractive,{$AGENT.CONF.NODATA})=1
        or nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.heartbeat,{$AGENT.CONF.NODATA})=1
    tags:
    - tag: component
      value: agent
    - tag: scope
      value: configuration
    - tag: check
      value: serveractive
    opdata: 'Configured ServerActive: {ITEM.LASTVALUE1}; policy: {$AGENT.SERVERACTIVE.MATCHES}'
    url: https://github.com/IT-for-Prof/zabbix-agent-config-guard/blob/main/README.md#triggers
    url_name: Configuration guard runbook
  - uuid: 2f1563041ebc46708ea312e5ca48ff2b
    expression: last(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.heartbeat)=0
    name: 'Zabbix agent: active-check heartbeat is disabled'
    event_name: 'Zabbix agent on {HOST.NAME}: active-check heartbeat is disabled'
    priority: WARNING
    description: The selected file declares HeartbeatFrequency equivalent to 0, disabling active-check heartbeats.
      This degrades the fast availability detector; an agent.ping nodata trigger is still needed as a fallback.
      Check the selected file and Include files, then restart the agent to apply the intended setting. This reports
      written configuration and does not prove the running agent has the same setting.
    dependencies:
    - name: 'Zabbix agent: configuration not collected'
      expression: nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.serveractive,{$AGENT.CONF.NODATA})=1
        or nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.heartbeat,{$AGENT.CONF.NODATA})=1
    tags:
    - tag: component
      value: agent
    - tag: scope
      value: configuration
    - tag: check
      value: heartbeat
    opdata: 'Configured HeartbeatFrequency: {ITEM.LASTVALUE1}'
    url: https://github.com/IT-for-Prof/zabbix-agent-config-guard/blob/main/README.md#triggers
    url_name: Configuration guard runbook
  - uuid: 1cb58db343cd45e1902f589adf1b75e2
    expression: nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.serveractive,{$AGENT.CONF.NODATA})=1
      or nodata(/Zabbix agent config guard Linux by Zabbix agent active/agent.conf.heartbeat,{$AGENT.CONF.NODATA})=1
    name: 'Zabbix agent: configuration not collected'
    event_name: 'Zabbix agent on {HOST.NAME}: configuration check data is missing for {$AGENT.CONF.NODATA}'
    priority: AVERAGE
    description: 'Either ServerActive or HeartbeatFrequency has received no valid values within {$AGENT.CONF.NODATA}.
      Configuration checks are incomplete; this does not by itself prove that the configuration is invalid. Check
      agent availability, the file path and read permission, then errors on the master and both dependent items.
      No data from a stopped active agent may leave the item state Normal with an empty error. Windows template
      dependencies suppress this trigger for either stock availability alarm. The Linux export is self-contained:
      assign dependencies to the local availability triggers at deployment, including the pfSense agent.ping fallback
      where applicable.'
    tags:
    - tag: component
      value: agent
    - tag: scope
      value: configuration
    - tag: check
      value: configuration_collection
    opdata: 'Configuration file: {$AGENT.CONF.PATH}'
    url: https://github.com/IT-for-Prof/zabbix-agent-config-guard/blob/main/README.md#triggers
    url_name: Configuration guard runbook
